databaseChangeLog:
  - changeSet:
      id: 001-create-producer-product-attribute-tables
      author: catalog-api
      changes:
        - createTable:
            tableName: producer
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2000)
                  constraints:
                    nullable: true
              - column:
                  name: price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: producer_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: product
            baseColumnNames: producer_id
            constraintName: fk_product_producer
            referencedTableName: producer
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE

        - createTable:
            tableName: product_attribute
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: attribute_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: attribute_value
                  type: VARCHAR(4000)
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: product_attribute
            baseColumnNames: product_id
            constraintName: fk_product_attribute_product
            referencedTableName: product
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE

